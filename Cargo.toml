[package]
name = "youtube_pipeline"
version = "0.1.0"
edition = "2021"

[lib]
name = "youtube_pipeline"
path = "src/lib.rs"

[[bin]]
name = "pipeline"
path = "src/bin/pipeline.rs"

[[bin]]
name = "orchestrator"
path = "src/bin/orchestrator.rs"

[[bin]]
name = "oauth_bootstrap"
path = "src/bin/oauth_bootstrap.rs"

[[bin]]
name = "analytics"
path = "src/bin/analytics.rs"

[[bin]]
name = "selector"
path = "src/bin/selector.rs"

[[bin]]
name = "dashboard"
path = "src/bin/dashboard.rs"

[dependencies]
anyhow     = "1"
reqwest    = { version = "0.12", features = ["json", "stream"] }
tokio      = { version = "1", features = ["full"] }
rusqlite   = { version = "0.31", features = ["bundled"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
futures    = "0.3"
flate2     = "1"
regex      = "1"
csv        = "1"
sha2       = "0.10"
hex        = "0.4"
once_cell  = "1"
clap       = { version = "4", features = ["derive", "env"] }
chrono     = { version = "0.4", features = ["clock"] }
axum       = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
