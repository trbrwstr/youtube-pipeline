name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a quick succession of pushes
# doesn't queue up redundant builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: build · test · clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Cache the registry, git deps, and target dir keyed on Cargo.lock.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      # rusqlite builds bundled SQLite from source; gcc ships on ubuntu-latest.
      - name: Build (all targets)
        run: cargo build --all-targets --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --locked -- -D warnings
