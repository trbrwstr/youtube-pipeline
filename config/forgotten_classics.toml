db_path = "./data/forgotten_classics.db"

[channel]
name   = "Forgotten Classics"
niche  = "classics"
format = "long"          # must be "long" or "short" — validate() enforces it

[throttle]
max_concurrency     = 4
default_interval_ms = 200
[throttle.host_intervals_ms]
"gutenberg.org"           = 250
"oauth2.googleapis.com"   = 50
"googleapis.com"          = 500

[auth]
client_id     = "${YT_CLIENT_ID}"
client_secret = "${YT_CLIENT_SECRET}"
refresh_token = "${YT_REFRESH_TOKEN}"
# token_url defaults to Google's; override only for a mock in tests

[metadata]
api_base = "https://api.openai.com/v1"
api_key = "${OPENAI_API_KEY}"
model = "gpt-4o-mini"
timeout_secs = 30
max_concurrency = 3
# YouTube hard limits
max_title_chars = 100
max_desc_chars = 5000
max_tags = 15
# spend ceiling shared with the hook stage's budget tracker
max_spend_usd = 5.0
cost_per_1k_input = 0.00015
cost_per_1k_output = 0.0006
channel_blurb = """
Forgotten Classics — public-domain books, distilled.

New videos weekly. Subscribe for more dead authors, live ideas.
"""