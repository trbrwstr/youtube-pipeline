db_path = "./data/forgotten_classics.db"
max_attempts = 3        # per-book stage failures before dead-lettering

[channel]
name   = "Forgotten Classics"
niche  = "classics"
format = "long"          # must be "long" or "short" — validate() enforces it

[throttle]
max_concurrency     = 4
default_interval_ms = 200
[throttle.host_intervals_ms]
"gutenberg.org"           = 250
"oauth2.googleapis.com"   = 50
"googleapis.com"          = 500

[auth]
client_id     = "${YT_CLIENT_ID}"
client_secret = "${YT_CLIENT_SECRET}"
refresh_token = "${YT_REFRESH_TOKEN}"
# token_url defaults to Google's; override only for a mock in tests

[metadata]
api_base = "https://api.openai.com/v1"
api_key = "${OPENAI_API_KEY}"
model = "gpt-4o-mini"
timeout_secs = 30
max_concurrency = 3
# YouTube hard limits
max_title_chars = 100
max_desc_chars = 5000
max_tags = 15
# spend ceiling shared with the hook stage's budget tracker
max_spend_usd = 5.0
cost_per_1k_input = 0.00015
cost_per_1k_output = 0.0006
channel_blurb = """
Forgotten Classics — public-domain books, distilled.

New videos weekly. Subscribe for more dead authors, live ideas.
"""

[ingest]
language        = "en"
max_issued_year = 1928
cache_dir       = "cache"
fetch_text      = true

[hook]
api_base      = "https://api.openai.com/v1"
api_key       = "${OPENAI_API_KEY}"
model         = "gpt-4o-mini"
wpm           = 150.0
max_hook_secs = 8.0
system_prompt = """
You are a hook writer for a Forgotten Classics YouTube channel. Tone: hushed, \
reverent, a little ominous. Make century-old prose feel urgent and alive. \
Never explain the book; tease it.
"""
timeout_secs  = 20
concurrency   = 6

[tts]
api_base     = "https://api.openai.com/v1"
api_key      = "${OPENAI_API_KEY}"
model        = "tts-1"
voice        = "onyx"
format       = "mp3"
speed        = 1.0
cache_dir    = "cache/audio"
timeout_secs = 60

[assemble]
background_image = "assets/classics_bg_1080x1920.png"
out_dir          = "data/video"

[thumbnail]
max_retries          = 3
request_timeout_secs = 60

[upload]
privacy_status = "unlisted"
category_id    = "27"
made_for_kids  = false
chunk_bytes    = 8388608
timeout_secs   = 120

[selector]
total_budget   = 100
min_per_niche  = 5
max_per_niche  = 60
min_sample     = 10
exploit_weight = 0.7